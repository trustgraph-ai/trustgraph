:14px">decision-scoring-laya</text><text class="s" x="405" y="79">open weights · ONNX</text></g><text class="lab" x="405" y="124" text-anchor="middle">~35 ms · English or multilingual</text><g class="n"><rect x="290" y="300" width="230" height="86" rx="10"/><text class="t" x="405" y="340" style="font-size:14px">cloze</text><text class="s" x="405" y="359">DistilBERT classifier</text></g><text class="lab" x="405" y="404" text-anchor="middle">label + confidence</text><text class="eb" x="588" y="26" text-anchor="start">ONE CALL · THREE OUTPUTS · EXAMPLE</text><text class="k" x="588" y="54" text-anchor="start">department</text><text class="mono" x="985" y="54" text-anchor="end">choice</text><text class="lab" x="588" y="79" text-anchor="start" style="font-size:12px">billing</text><rect x="680" y="68" width="300" height="12" rx="6" fill="rgba(157,184,255,.12)"/><text class="lab" x="588" y="101" text-anchor="start" style="font-size:12px">technical</text><rect x="680" y="90" width="300" height="12" rx="6" fill="rgba(157,184,255,.12)"/><text class="lab" x="588" y="123" text-anchor="start" style="font-size:12px">sales</text><rect x="680" y="112" width="300" height="12" rx="6" fill="rgba(157,184,255,.12)"/><text class="k" x="588" y="150" text-anchor="start">urgency</text><text class="mono" x="985" y="150" text-anchor="end">score</text><text class="lab" x="630" y="214" text-anchor="middle" style="font-size:11.5px">none</text><rect x="612" y="162" width="36" height="38" rx="4" fill="rgba(157,184,255,.10)"/><text class="lab" x="706" y="214" text-anchor="middle" style="font-size:11.5px">low</text><rect x="688" y="162" width="36" height="38" rx="4" fill="rgba(157,184,255,.10)"/><text class="lab" x="782" y="214" text-anchor="middle" style="font-size:11.5px">medium</text><rect x="764" y="162" width="36" height="38" rx="4" fill="rgba(157,184,255,.10)"/><text class="lab" x="858" y="214" text-anchor="middle" style="font-size:11.5px">high</text><rect x="840" y="162" width="36" height="38" rx="4" fill="rgba(157,184,255,.10)"/><text class="lab" x="934" y="214" text-anchor="middle" style="font-size:11.5px">critical</text><rect x="916" y="162" width="36" height="38" rx="4" fill="rgba(157,184,255,.10)"/><text class="k" x="588" y="240" text-anchor="start">refund requested</text><text class="mono" x="985" y="240" text-anchor="end">noul</text><rect x="588" y="250" width="300" height="12" rx="6" fill="rgba(157,184,255,.12)"/><g class="n"><rect x="570" y="296" width="430" height="70" rx="10"/></g><text class="eb" x="586" y="320" text-anchor="start">LABELED EXAMPLES IN CONFIG</text><text class="lab" x="586" y="346" text-anchor="start" style="font-size:12.5px">retrained on config push · stratified split · kept above min-accuracy</text><g class="n tri"><rect x="570" y="384" width="430" height="70" rx="10"/></g><text class="eb" x="586" y="408" text-anchor="start">TOOL SELECTION · EXAMPLE</text><text class="t" x="125" y="358" text-anchor="middle">No LLM call</text><text class="s" x="125" y="382" text-anchor="middle">no tokens · no output parsing</text></g><g><rect x="680" y="68" width="0" height="12" rx="6" fill="#3dbe6a"><animate attributeName="width" dur="6.6s" repeatCount="indefinite" values="0;0;246;246;0;0" keyTimes="0;0.1364;0.2121;0.9242;0.9697;1" calcMode="linear"/></rect><rect x="680" y="90" width="0" height="12" rx="6" fill="#9db8ff"><animate attributeName="width" dur="6.6s" repeatCount="indefinite" values="0;0;36;36;0;0" keyTimes="0;0.1364;0.2121;0.9242;0.9697;1" calcMode="linear"/></rect><rect x="680" y="112" width="0" height="12" rx="6" fill="#9db8ff"><animate attributeName="width" dur="6.6s" repeatCount="indefinite" values="0;0;18;18;0;0" keyTimes="0;0.1364;0.2121;0.9242;0.9697;1" calcMode="linear"/></rect><rect x="612" y="200" width="36" height="0" rx="4" fill="#9db8ff"><animate attributeName="height" dur="6.6s" repeatCount="indefinite" values="0;0;3;3;0;0" keyTimes="0;0.2121;0.2879;0.9242;0.9697;1" calcMode="linear"/><animate attributeName="y" dur=