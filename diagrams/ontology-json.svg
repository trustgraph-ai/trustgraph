03a"/><text class="vt" x="206" y="35" style="font-size:11px">converted</text><text class="eb" x="305" y="28" text-anchor="start">NATIVE FORMAT · JSON</text><text class="mono" x="305" y="50" text-anchor="start" style="font-size:11.5px;fill:#c8d4f3">config type: ontology · key: baseball</text><text class="eb" x="765" y="14" text-anchor="start">USED BY</text><g class="n"><rect x="765" y="30" width="235" height="72" rx="10"/><text class="t" x="882.5" y="63" style="font-size:15px">kg-extract-ontology</text><text class="s" x="882.5" y="82">guides extraction</text></g><g class="n"><rect x="765" y="134" width="235" height="72" rx="10"/><text class="t" x="882.5" y="167" style="font-size:15px">Ontology Viewer</text><text class="s" x="882.5" y="186">types and instances</text></g><g class="n"><rect x="765" y="238" width="235" height="72" rx="10"/><text class="t" x="882.5" y="271" style="font-size:15px">VOWL visualizer</text><text class="s" x="882.5" y="290">Workbench</text></g><g class="n"><rect x="765" y="342" width="235" height="72" rx="10"/><text class="t" x="882.5" y="375" style="font-size:15px">Export</text><text class="s" x="882.5" y="394">JSON · Turtle · OWL/XML</text></g><text class="lab" x="882" y="470" text-anchor="middle">edits reach processors</text><text class="lab" x="882" y="488" text-anchor="middle">by config push</text></g><g><text class="mono" x="307" y="82.0" style="fill:#e3eafb;font-size:12px">{</text><text class="mono" x="323" y="103.2" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;metadata"</tspan>: {</text><text class="mono" x="339" y="124.4" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;name"</tspan>: &quot;Baseball&quot;,</text><text class="mono" x="339" y="145.6" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;namespace"</tspan>: &quot;http://example.org/baseball#&quot; },</text><text class="mono" x="323" y="166.8" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;classes"</tspan>: {</text><text class="mono" x="339" y="188.0" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;Player"</tspan>: {</text><text class="mono" x="355" y="209.2" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;type"</tspan>: &quot;owl:Class&quot;,</text><text class="mono" x="355" y="230.4" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;rdfs:subClassOf"</tspan>: &quot;Person&quot;,</text><text class="mono" x="355" y="251.6" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;rdfs:label"</tspan>: [</text><text class="mono" x="371" y="272.79999999999995" style="fill:#e3eafb;font-size:12px">{ &quot;value&quot;: &quot;Player&quot;, &quot;lang&quot;: &quot;en&quot; },</text><text class="mono" x="371" y="294.0" style="fill:#e3eafb;font-size:12px">{ &quot;value&quot;: &quot;Joueur&quot;, &quot;lang&quot;: &quot;fr&quot; } ] } },</text><text class="mono" x="323" y="315.2" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;objectProperties"</tspan>: {</text><text class="mono" x="339" y="336.4" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;playsPosition"</tspan>: {</text><text class="mono" x="355" y="357.59999999999997" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;rdfs:domain"</tspan>: &quot;Player&quot;,</text><text class="mono" x="355" y="378.8" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;rdfs:range"</tspan>: &quot;BaseballPosition&quot; } },</text><text class="mono" x="323" y="400.0" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;datatypeProperties"</tspan>: {</text><text class="mono" x="339" y="421.2" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;jerseyNumber"</tspan>: {</text><text class="mono" x="355" y="442.4" style="fill:#e3eafb;font-size:12px"><tspan fill="#9db8ff">&quot;rdfs:range"</tspan>: &quot;xsd:integer&quot; } }</text><text class="mono" x="307" y="463.59999999999997" style="fill:#e3eafb;font-size:12px">}</text