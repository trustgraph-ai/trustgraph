WL ONTOLOGY · IN-MEMORY STORE</text><text class="lab" x="500" y="26" text-anchor="end" style="text-anchor:end;font-size:12px">VOWL view, as in the Workbench</text><text class="lab" x="160" y="112" text-anchor="start" style="text-anchor:start;font-size:11.5px">subclass of</text><rect class="vp" x="262.3345" y="179.1117" width="109.6" height="22" rx="3"/><text class="vt" x="317.1345" y="194.1117" style="font-weight:500;font-size:11.5px">playsPosition</text><rect class="vp" x="295.1108" y="114.4094" width="73.6" height="22" rx="3"/><text class="vt" x="331.9108" y="129.4094" style="font-weight:500;font-size:11.5px">memberOf</text><path class="va" d="M220 200 V246"/><rect class="vd" x="170" y="246" width="100" height="24"/><text class="vt" x="220" y="263" style="font-weight:500;font-size:11.5px">jerseyNumber</text><circle class="vc" cx="80" cy="100" r="36"/><text class="vt" x="80" y="104">Person</text><circle class="vc" cx="80" cy="220" r="34"/><text class="vt" x="80" y="224">Umpire</text><circle class="vc" cx="220" cy="160" r="40"/><text class="vt" x="220" y="164">Player</text><circle class="vc" cx="440" cy="92" r="36"/><text class="vt" x="440" y="96">Team</text><circle class="vc" cx="420" cy="222" r="46"/><text class="vt" x="420" y="219">Baseball</text><text class="vt" x="420" y="234">Position</text><text class="lab" x="20" y="290" text-anchor="start" style="text-anchor:start;font-size:12px">each term&#x27;s label and comment tell the LLM what it means</text><g class="n"><rect x="570" y="0" width="200" height="112" rx="10"/></g><text class="eb" x="586" y="24" text-anchor="start">ANY TEXT</text><rect class="sbar" x="586" y="41" width="160" height="12" rx="6"/><rect class="sbar" x="586" y="65" width="130" height="12" rx="6"/><rect class="sbar" x="586" y="89" width="150" height="12" rx="6"/><g class="n"><rect x="570" y="150" width="200" height="84" rx="10"/><text class="t" x="670" y="189" style="font-size:14px">kg-extract-ontology</text><text class="s" x="670" y="208">LLM reads the ontology</text></g><text class="eb" x="800" y="18" text-anchor="start">TYPED OUTPUT</text><rect x="800" y="30" width="200" height="34" rx="8" fill="none" stroke="rgba(157,184,255,.2)" stroke-dasharray="4 5"/><rect x="800" y="74" width="200" height="34" rx="8" fill="none" stroke="rgba(157,184,255,.2)" stroke-dasharray="4 5"/><rect x="800" y="118" width="200" height="34" rx="8" fill="none" stroke="rgba(157,184,255,.2)" stroke-dasharray="4 5"/><text class="lab" x="905" y="176" text-anchor="middle">conforms to the ontology</text><g class="n st"><path d="M570 359 a100.0 9 0 0 1 200 0 v48 a100.0 9 0 0 1 -200 0 Z"/><path class="lip" d="M570 359 a100.0 9 0 0 0 200 0"/><text class="t" x="670" y="384">Vector store</text><text class="s" x="670" y="403">entity embeddings</text></g><g class="n st"><path d="M800 359 a100.0 9 0 0 1 200 0 v48 a100.0 9 0 0 1 -200 0 Z"/><path class="lip" d="M800 359 a100.0 9 0 0 0 200 0"/><text class="t" x="900" y="384">Knowledge graph</text><text class="s" x="900" y="403">relationships</text></g><text class="lab" x="1000" y="442" text-anchor="end" style="text-anchor:end;font-size:12px">used for retrieval: similarity → entry points → traversal</text></g><g><g opacity="0"><animate attributeName="opacity" dur="6.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3548;0.3952;0.9435;0.9839;1" calcMode="linear"/><rect x="800" y="30" width="200" height="34" rx="8" fill="rgba(61,190,106,.16)" stroke="#3dbe6a" stroke-opacity=".7"/><text class="mono" x="809" y="52" style="fill:#fff;font-size:10.5px">:Who a :Player</text></g><g opacity="0"><animate attributeName="opacity" dur="6.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3871;0.4274;0.9435;0.9839;1" calcMode="linear"/><rect x="800" y="74" width="200" height="34" rx="8" fill="rgba(61,190,106,.16)" stroke="#3dbe6a" stroke-opacity=".7"/><text class="mono" x="809" y="96" style="fill:#fff;font-size:10.5px">:FirstBase a :BaseballPosition</text></g><g opacity="0"><animate 