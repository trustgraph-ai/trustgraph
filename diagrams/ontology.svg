<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 548" width="1040" height="548" role="img" aria-label="Ontology-driven extraction: an OWL ontology, shown in VOWL notation, is read by the LLM during extraction; typed instances are classified against its classes and stored as vectors and graph relationships"><title>The ontology defines what extraction produces</title><style>
.e{fill:none;stroke:rgba(157,184,255,.36);stroke-width:1.6}
