="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4286;0.4643;0.9429;0.9786;1" calcMode="linear"/><rect x="410" y="194" width="560" height="152" rx="12" fill="rgba(17,31,92,.85)" stroke="#3dbe6a" stroke-opacity=".55"/><rect x="410" y="194" width="5" height="152" rx="2.5" fill="#3dbe6a"/><text class="t" x="430" y="220" style="text-anchor:start;font-size:15px">How it was extracted</text><text class="mono" x="952" y="220" text-anchor="end" style="fill:#3dbe6a">urn:graph:source</text></g><g opacity="0"><animate attributeName="opacity" dur="7.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4643;0.5;0.9429;0.9786;1" calcMode="linear"/><animateTransform attributeName="transform" type="translate" dur="7.0s" repeatCount="indefinite" values="0 6;0 6;0 0;0 0" keyTimes="0;0.4643;0.5071;1"/><text class="k" x="430" y="244">tg:contains</text><text class="v" x="640" y="244">quoted triple inside its extraction subgraph</text></g><g opacity="0"><animate attributeName="opacity" dur="7.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5257;0.9429;0.9786;1" calcMode="linear"/><animateTransform attributeName="transform" type="translate" dur="7.0s" repeatCount="indefinite" values="0 6;0 6;0 0;0 0" keyTimes="0;0.49;0.5329;1"/><text class="k" x="430" y="272">prov:wasGeneratedBy</text><text class="v" x="640" y="272">the extraction activity and the agent that ran it</text></g><g opacity="0"><animate attributeName="opacity" dur="7.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5157;0.5514;0.9429;0.9786;1" calcMode="linear"/><animateTransform attributeName="transform" type="translate" dur="7.0s" repeatCount="indefinite" values="0 6;0 6;0 0;0 0" keyTimes="0;0.5157;0.5586;1"/><text class="k" x="430" y="300">tg:llmModel · tg:ontology</text><text class="v" x="640" y="300">model and ontology used</text></g><g opacity="0"><animate attributeName="opacity" dur="7.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5414;0.5771;0.9429;0.9786;