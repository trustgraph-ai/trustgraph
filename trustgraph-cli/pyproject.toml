[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgraph-cli"
dynamic = ["version"]
authors = [{name = "trustgraph.ai", email = "security@trustgraph.ai"}]
description = "TrustGraph provides a means to run a pipeline of flexible AI processing components in a flexible means to achieve a processing pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "trustgraph-base>=3.0.0a0,<3.1",
    "requests",
    "pulsar-client",
    "aiohttp",
    "rdflib",
    "ohi-sdk>=0.18.7,<0.19",
    "tabulate",
    "msgpack",
    "websockets",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/trustgraph-ai/trustgraph"

[project.scripts]
tg-add-library-document = "trustgraph.cli.add_library_document:main"
tg-bump-graph-version = "trustgraph.cli.bump_graph_version:main"
