type: object
description: |
  Graph RAG (Retrieval-Augmented Generation) query request.
  Searches knowledge graph and generates answer using retrieved subgraph.
required:
  - query
properties:
  query:
    type: string
    description: User query or question
    example: What connections exist between quantum physics and computer science?
  collection:
    type: string
    description: Collection to search within
    default: default
    example: research
  entity-limit:
    type: integer
    description: Maximum number of entities to retrieve
    default: 50
    minimum: 1
    maximum: 200
    example: 30
  triple-limit:
    type: integer
    description: Maximum number of triples to retrieve per entity
    default: 30
    minimum: 1
    maximum: 100
    example: 20
  max-subgraph-size:
    type: integer
    description: Maximum total subgraph size (triples)
    default: 1000
    minimum: 10
    maximum: 5000
    example: 500
  max-path-length:
    type: integer
    description: Maximum path length for graph traversal
    default: 2
    minimum: 1
    maximum: 5
    example: 3
  max-reranker-input:
    type: integer
    description: Maximum candidate edges sent to the reranker per hop
    default: 350
    minimum: 1
    maximum: 1000
    example: 350
  streaming:
    type: boolean
    description: Enable streaming response delivery
    default: false
    example: true
  grounding-seeds:
    type: array
    description: |
      Optional list of text concepts to use as grounding seeds,
      bypassing the LLM concept extraction phase. Mutually exclusive
      with graph-seeds.
    items:
      type: string
    example: ["graphrag", "information retrieval"]
  graph-seeds:
    type: array
    description: |
      Optional list of entity IRIs to use as initial traversal entry
      points, bypassing both grounding and entity lookup. Mutually
      exclusive with grounding-seeds.
    items:
      type: string
    example: ["http://example.org/Person/JaneDoe"]
  languages:
    type: array
    description: |
      Optional list of language tags to restrict retrieval to. An
      empty string matches literals with no language tag.
    items:
      type: string
    example: ["en", ""]
  traversal-instructions:
    type: array
    description: |
      Optional ordered list of traversal steps. Each item corresponds
      to a hop and may specify type restrictions, relationship
      restrictions, and/or named graph restrictions. The first item
      can only specify types (no preceding edge to constrain).
    items:
      type: object
      properties:
        types:
          type: array
          description: RDF type IRIs — only nodes of these types are eligible
          items:
            type: string
        relationships:
          type: array
          description: Predicate IRIs — only these edges are followed
          items:
            type: string
        graphs:
          type: array
          description: Named graph URIs — only triples from these graphs are retrieved
          items:
            type: string
